<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסע יוד</title>

<!-- iPhone: הוספה למסך הבית כאפליקציה -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מסע יוד">
<meta name="theme-color" content="#0d0b0a">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d0b0a;
    --card: #171312;
    --card-2: #1f1917;
    --line: #2e2522;
    --text: #f4ece6;
    --muted: #9c8f86;
    --red: #e5322d;
    --red-dark: #a51f1b;
    --brown: #8a5a36;
    --brown-light: #c08a5c;
    --gold: #f2b84b;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 40px);
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(229,50,45,.16), transparent 60%),
      radial-gradient(90% 50% at 0% 10%, rgba(138,90,54,.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* חוסם את אזור שורת הסטטוס כשגוללים במצב אפליקציה */
  body::before {
    content: ""; position: fixed; top: 0; left: 0; right: 0;
    height: var(--safe-top); background: var(--bg); z-index: 30;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  button { font-family: inherit; color: inherit; cursor: pointer; }

  /* ---------- כותרת ---------- */
  header { padding: 10px 2px 18px; }
  .kicker {
    display: inline-block;
    font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: var(--bg); background: var(--red);
    padding: 4px 10px 3px; border-radius: 4px;
    transform: rotate(-2deg);
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(44px, 14vw, 64px);
    font-weight: 900;
    line-height: .95;
    letter-spacing: -.02em;
  }
  h1 .accent { color: var(--red); }
  .sub {
    margin-top: 8px;
    font-size: 17px; font-weight: 500;
    color: var(--brown-light);
    display: flex; align-items: center; gap: 10px;
  }
  .sub::before {
    content: ""; width: 26px; height: 3px; background: var(--brown-light); border-radius: 2px;
  }

  /* ---------- מד ראשי ---------- */
  .hero {
    position: relative;
    background: linear-gradient(160deg, #1d1715, #120f0e);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px 20px 18px;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute; inset: auto -40px -60px auto;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(229,50,45,.25), transparent 70%);
    pointer-events: none;
  }
  .hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .big-pct {
    font-size: 84px; font-weight: 900; line-height: .85;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .big-pct small { font-size: 36px; color: var(--red); margin-left: 2px; }
  .hero-meta { text-align: left; padding-bottom: 6px; }
  .hero-meta .label { font-size: 13px; color: var(--muted); }
  .hero-meta .count { font-size: 22px; font-weight: 700; direction: ltr; }
  .hero-meta .count span { color: var(--muted); font-weight: 500; }

  .bar {
    position: relative;
    margin-top: 16px;
    height: 18px;
    background: #0a0807;
    border-radius: 99px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .bar-fill {
    position: absolute; inset: 0 0 0 auto; /* מתמלא מימין לשמאל */
    width: 0%;
    border-radius: 99px;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 8px, transparent 8px 16px),
      linear-gradient(90deg, var(--red), var(--brown) );
    background-size: 22px 22px, 100% 100%;
    animation: stripes 1s linear infinite;
    transition: width .8s cubic-bezier(.22,1.2,.36,1);
  }
  .bar-fill.full { background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 8px, transparent 8px 16px),
      linear-gradient(90deg, var(--gold), var(--red)); background-size: 22px 22px, 100% 100%; }
  @keyframes stripes { to { background-position: 22px 0, 0 0; } }

  .hero-msg { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 1.2em; }

  /* ---------- סרגל כלים ---------- */
  .toolbar {
    position: sticky; top: var(--safe-top); z-index: 20;
    display: flex; gap: 10px; align-items: center;
    margin: 16px -16px 6px;
    padding: 10px 16px;
    background: linear-gradient(var(--bg) 75%, rgba(13,11,10,0));
  }
  .seg {
    flex: 1;
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    position: relative;
  }
  .seg button {
    position: relative; z-index: 1;
    border: 0; background: none;
    padding: 10px 6px;
    font-size: 15px; font-weight: 700;
    color: var(--muted);
    transition: color .25s;
  }
  .seg button.on { color: #fff; }
  .seg .pill {
    position: absolute; top: 4px; bottom: 4px; right: 4px;
    width: calc(50% - 4px);
    background: var(--red);
    border-radius: 10px;
    transition: transform .3s cubic-bezier(.3,1.3,.5,1);
  }
  .seg[data-filter="left"] .pill { transform: translateX(-100%); }

  .reset-btn {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    width: 50px; height: 50px;
    font-size: 20px;
    display: grid; place-items: center;
  }
  .reset-btn:active { transform: scale(.94); }

  /* ---------- כרטיסי קטגוריה ---------- */
  .cats { display: flex; flex-direction: column; gap: 12px; }

  .cat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .3s, opacity .3s;
  }
  .cat.done { border-color: rgba(138,90,54,.6); }

  .cat-head {
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 14px 14px 12px;
    background: none; border: 0; text-align: right;
  }
  .cat-emoji {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    font-size: 22px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    position: relative;
  }
  .cat.done .cat-emoji::after {
    content: "✓";
    position: absolute; top: -6px; left: -6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--red); color: #fff;
    font-size: 13px; font-weight: 900;
    display: grid; place-items: center;
    border: 2px solid var(--card);
    animation: pop .4s cubic-bezier(.3,1.6,.5,1);
  }
  .cat-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
  .cat-mini {
    margin-top: 8px;
    height: 5px; border-radius: 9px;
    background: #0a0807;
    overflow: hidden;
    position: relative;
  }
  .cat-mini i {
    position: absolute; inset: 0 0 0 auto;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--brown-light));
    border-radius: 9px;
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }
  .cat.done .cat-mini i { background: var(--brown-light); }
  .cat-count {
    font-size: 14px; font-weight: 700;
    direction: ltr;
    background: var(--card-2);
    border: 1px solid var(--line);
    padding: 5px 9px;
    border-radius: 9px;
    font-variant-numeric: tabular-nums;
  }
  .cat.done .cat-count { background: var(--brown); border-color: var(--brown); color: #fff; }
  .chev {
    width: 22px; text-align: center;
    color: var(--muted);
    transition: transform .3s;
    font-size: 14px;
  }
  .cat.collapsed .chev { transform: rotate(90deg); }

  .cat-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .35s cubic-bezier(.3,1,.4,1);
  }
  .cat.collapsed .cat-body { grid-template-rows: 0fr; }
  .cat-body > .inner { overflow: hidden; min-height: 0; }

  ul.items { list-style: none; margin: 0; padding: 0 8px; }

  li.item {
    position: relative;
    border-top: 1px solid var(--line);
    overflow: hidden;
    transition: height .25s, opacity .25s;
  }
  li.item.hidden { display: none; }
  .item-del-bg {
    position: absolute; inset: 0;
    background: var(--red-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .item-row {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 13px 6px;
    background: var(--card);
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
    transition: transform .25s ease;
  }
  .item-row.dragging { transition: none; }

  .check {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid #4a3c35;
    display: grid; place-items: center;
    transition: background .2s, border-color .2s;
  }
  .check svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.4; fill: none;
    stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s; }
  .item.done .check { background: var(--red); border-color: var(--red); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  .item.done .check svg { stroke-dashoffset: 0; }

  .item-text {
    flex: 1;
    font-size: 16px; line-height: 1.35;
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: transparent;
    transition: color .3s, text-decoration-color .3s;
  }
  .item.done .item-text { color: var(--muted); text-decoration-color: var(--red); }

  .del-btn {
    flex: none;
    width: 30px; height: 30px;
    border: 0; border-radius: 8px;
    background: transparent;
    color: #5b4b43;
    font-size: 20px; line-height: 1;
  }
  .del-btn:active { background: var(--card-2); color: var(--red); }

  /* פריט מיוחד – מתנה לנוני */
  li.item.special { border-top: 0; padding: 8px 0; }
  li.item.special .item-row {
    border-radius: 14px;
    padding: 16px 12px;
    background:
      linear-gradient(var(--card-2), var(--card-2)) padding-box,
      linear-gradient(120deg, var(--gold), var(--red), var(--brown-light), var(--gold)) border-box;
    background-size: 100% 100%, 300% 300%;
    border: 2px solid transparent;
    animation: glowshift 4s ease infinite;
    box-shadow: 0 0 22px rgba(229,50,45,.25);
  }
  li.item.special .item-del-bg { border-radius: 14px; top: 8px; bottom: 8px; }
  li.item.special .item-text {
    font-size: 19px; font-weight: 900;
    background: linear-gradient(90deg, var(--gold), #ff6b5e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  li.item.special .item-text::before { content: "🎁 "; -webkit-text-fill-color: initial; }
  li.item.special.done .item-text { -webkit-text-fill-color: var(--muted); text-decoration-color: var(--gold); }
  li.item.special .check { border-color: var(--gold); }
  li.item.special.done .check { background: var(--gold); border-color: var(--gold); }
  li.item.special .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    background: var(--gold); color: #1a0f08;
    padding: 3px 7px; border-radius: 6px;
  }
  @keyframes glowshift { 0%,100% { background-position: 0 0, 0% 50%; } 50% { background-position: 0 0, 100% 50%; } }

  /* הוספת פריט */
  .add-row {
    display: flex; gap: 8px;
    padding: 10px 8px 14px;
    border-top: 1px dashed var(--line);
  }
  .add-row input {
    flex: 1; min-width: 0;
    background: #0e0b0a;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 12px;
    color: var(--text);
    font-family: inherit; font-size: 16px; /* 16px מונע זום באייפון */
    outline: none;
  }
  .add-row input:focus { border-color: var(--brown-light); }
  .add-row input::placeholder { color: #6a5b52; }
  .add-row button {
    border: 0; border-radius: 12px;
    background: var(--brown);
    color: #fff;
    font-size: 24px; font-weight: 700;
    width: 46px;
  }
  .add-row button:active { background: var(--red); }

  .empty {
    display: none;
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty b { display: block; font-size: 22px; color: var(--text); margin-bottom: 6px; }

  .hint { text-align: center; color: #5f524a; font-size: 12px; margin-top: 22px; }

  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

  /* ---------- מודאלים ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(5,4,4,.78);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 20px 18px;
    transform: translateY(20px) scale(.96);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1);
  }
  .overlay.show .modal { transform: none; }
  .modal h3 { margin: 0 0 6px; font-size: 22px; font-weight: 900; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .modal .btns { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    border: 0; border-radius: 13px;
    padding: 14px;
    font-size: 16px; font-weight: 700;
    background: var(--card-2);
  }
  .btn.red { background: var(--red); color: #fff; }
  .btn.brown { background: var(--brown); color: #fff; }
  .btn:active { transform: scale(.98); }

  .ready {
    text-align: center;
    background: transparent; border: 0;
  }
  .ready .fire { font-size: 90px; line-height: 1; animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  .ready h2 {
    margin: 10px 0 6px;
    font-size: 46px; font-weight: 900; line-height: 1;
    color: #fff;
    text-shadow: 0 4px 0 var(--red-dark), 0 0 30px rgba(229,50,45,.6);
  }
  .ready p { color: var(--brown-light); font-size: 17px; margin-bottom: 24px; }

  #confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">טיול שנתי</div>
    <h1>מסע יוד <span class="accent">🥾</span></h1>
    <div class="sub">3 ימים · 30 ק״מ</div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="hero-top">
      <div class="big-pct"><span id="pct">0</span><small>%</small></div>
      <div class="hero-meta">
        <div class="label">נארזו</div>
        <div class="count" id="totalCount">0 <span>/ 0</span></div>
      </div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="hero-msg" id="heroMsg"></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="seg" data-filter="all">
      <div class="pill"></div>
      <button data-f="all" class="on">הכל</button>
      <button data-f="left">מה נשאר לארוז</button>
    </div>
    <button class="reset-btn" id="resetBtn" aria-label="איפוס">↺</button>
  </div>

  <main class="cats" id="cats"></main>
  <div class="empty" id="empty"><b>הכל ארוז! 🔥</b>אין יותר מה לארוז. צא לדרך.</div>

  <p class="hint">לחיצה מסמנת · החלקה הצידה או × מוחקת פריט</p>
</div>

<!-- אישור איפוס -->
<div class="overlay" id="resetModal">
  <div class="modal">
    <h3>לאפס? 🤔</h3>
    <p>אי אפשר לבטל את זה. בחר מה לאפס:</p>
    <div class="btns">
      <button class="btn red" id="resetChecks">נקה את כל הסימונים</button>
      <button class="btn brown" id="resetAll">חזרה לרשימה המקורית</button>
      <button class="btn" id="resetCancel">ביטול</button>
    </div>
  </div>
</div>

<!-- התיק מוכן -->
<div class="overlay" id="readyModal">
  <div class="modal ready">
    <div class="fire">🎒</div>
    <h2>התיק מוכן! 🔥</h2>
    <p>3 ימים · 30 ק״מ · יאללה לשביל</p>
    <div class="btns"><button class="btn red" id="readyClose">יאללה! 🥾</button></div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(() => {
  const STORAGE_KEY = 'masa-yod-checklist-v1';

  const DEFAULTS = [
    { title: 'תיק קטן – יום ראשון', emoji: '🎒', items: [
      '3 ליטר מים מלאים', 'אלקטרוליטים', 'ארוחת בוקר וצהריים', 'חטיפי אנרגיה (תמרים, אגוזים, גרנולה)',
      'כובע רחב שוליים', 'משקפי שמש', 'קרם הגנה SPF 50', 'שפתון הגנה', 'באף / בנדנה',
      'טישו + מגבונים לחים', "ג'ל לחיטוי ידיים", 'ערכת שלפוחיות (פלסטרים, קומפיד)', 'תרופות אישיות',
      'טלפון', 'פאוור בנק', 'חולצה להחלפה', 'זוג גרביים רזרבי', 'שקית לפסולת', 'שקית ניילון לטלפון' ] },
    { title: 'תיק גדול – שינה', emoji: '🛏️', items: [
      'שק״ש', 'כרית קטנה / מתנפחת', 'בגדים לשינה', 'פנס ראש + סוללות' ] },
    { title: 'תיק גדול – ביגוד', emoji: '👕', items: [
      '3–4 חולצות דרייפיט', '3 מכנסיים ארוכים', '4 תחתונים', '4 זוגות גרבי הליכה',
      'סווטשירט / פליז', 'מעיל רוח דק', 'כפכפים' ] },
    { title: 'תיק גדול – רחצה', emoji: '🧼', items: [
      'מגבת מיקרופייבר', 'מברשת ומשחת שיניים', 'סבון ושמפו', 'דאודורנט', 'ציוד היגיינה אישי',
      'וזלין נגד שפשופים', 'טלק לרגליים' ] },
    { title: 'תיק גדול – שונות', emoji: '🧳', items: [
      'מים לימים 2–3', 'מטען + כבל', 'תרופות אישיות', 'שקית לבגדים מלוכלכים',
      'שקיות ניילון רזרביות', 'שרוכים רזרביים', 'אטמי אוזניים' ] },
    { title: 'לבוש בהליכה', emoji: '👟', items: [
      'נעליים סגורות שכבר ננעלו', 'מכנסיים ארוכים', 'כובע' ] },
    { title: 'זמן פנוי', emoji: '🎲', items: [
      'קלפים / אונו', 'משחקי קופסה קטנים', 'פריזבי' ] },
    { title: 'מותרות', emoji: '✨', items: [
      'ממתקים לחלק', 'אוזניות זולות', 'מסכת עיניים', 'מאוורר יד', 'קפה / שוקו נמס',
      'מחברת ועט', 'רמקול קטן (אם מותר)' ] },
    { title: 'מיוחד', emoji: '🎁', items: [ 'מתנה לנוני' ] },
  ];

  const isSpecial = text => text.replace(/\s+/g, ' ').trim() === 'מתנה לנוני';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function freshState() {
    return {
      filter: 'all',
      cats: DEFAULTS.map((c, ci) => ({
        id: 'c' + ci, title: c.title, emoji: c.emoji, collapsed: false,
        items: c.items.map((t, ii) => ({ id: 'c' + ci + 'i' + ii, text: t, done: false }))
      }))
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.cats)) return s;
      }
    } catch (e) {}
    return freshState();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = load();

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const catsEl = $('cats');

  function render() {
    catsEl.textContent = '';
    state.cats.forEach(cat => catsEl.appendChild(buildCat(cat)));
    applyFilter();
    updateAll(false);
  }

  function buildCat(cat) {
    const card = document.createElement('section');
    card.className = 'cat';
    card.dataset.id = cat.id;
    if (cat.collapsed) card.classList.add('collapsed');

    const head = document.createElement('button');
    head.className = 'cat-head';
    head.innerHTML = `
      <div class="cat-emoji"></div>
      <div><div class="cat-title"></div><div class="cat-mini"><i></i></div></div>
      <div class="cat-count"></div>
      <div class="chev">▼</div>`;
    head.querySelector('.cat-emoji').textContent = cat.emoji;
    head.querySelector('.cat-title').textContent = cat.title;
    head.addEventListener('click', () => {
      cat.collapsed = !cat.collapsed;
      card.classList.toggle('collapsed', cat.collapsed);
      save();
    });

    const body = document.createElement('div');
    body.className = 'cat-body';
    const inner = document.createElement('div');
    inner.className = 'inner';
    const ul = document.createElement('ul');
    ul.className = 'items';
    cat.items.forEach(it => ul.appendChild(buildItem(cat, it)));

    const add = document.createElement('form');
    add.className = 'add-row';
    add.innerHTML = `<input type="text" placeholder="הוסף פריט…" enterkeyhint="done" maxlength="80"><button type="submit" aria-label="הוסף">+</button>`;
    add.addEventListener('submit', e => {
      e.preventDefault();
      const input = add.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const it = { id: uid(), text, done: false };
      cat.items.push(it);
      const li = buildItem(cat, it);
      li.style.animation = 'pop .35s';
      ul.appendChild(li);
      input.value = '';
      save();
      updateAll(true);
    });

    inner.append(ul, add);
    body.appendChild(inner);
    card.append(head, body);
    return card;
  }

  const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function buildItem(cat, it) {
    const li = document.createElement('li');
    li.className = 'item';
    li.dataset.id = it.id;
    if (it.done) li.classList.add('done');
    const special = isSpecial(it.text);
    if (special) li.classList.add('special');

    li.innerHTML = `
      <div class="item-del-bg"><span>🗑 מחק</span><span>מחק 🗑</span></div>
      <div class="item-row">
        <div class="check">${CHECK_SVG}</div>
        <div class="item-text"></div>
        ${special ? '<span class="badge">מיוחד</span>' : ''}
        <button class="del-btn" aria-label="מחק">×</button>
      </div>`;
    li.querySelector('.item-text').textContent = it.text;

    const row = li.querySelector('.item-row');
    let swiped = false;

    row.addEventListener('click', e => {
      if (swiped) { swiped = false; return; }
      if (e.target.closest('.del-btn')) return;
      toggleItem(cat, it, li);
    });
    li.querySelector('.del-btn').addEventListener('click', e => {
      e.stopPropagation();
      removeItem(cat, it, li);
    });

    // החלקה למחיקה
    let sx = 0, sy = 0, dx = 0, dragging = false, locked = null;
    row.addEventListener('touchstart', e => {
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; dx = 0; dragging = true; locked = null;
    }, { passive: true });
    row.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t = e.touches[0];
      const mx = t.clientX - sx, my = t.clientY - sy;
      if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      }
      if (locked !== 'x') return;
      e.preventDefault();
      dx = mx;
      row.classList.add('dragging');
      row.style.transform = `translateX(${dx}px)`;
    }, { passive: false });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      row.classList.remove('dragging');
      if (locked === 'x') {
        swiped = true;
        setTimeout(() => { swiped = false; }, 350);
        if (Math.abs(dx) > row.offsetWidth * 0.35) {
          row.style.transform = `translateX(${dx > 0 ? '110%' : '-110%'})`;
          setTimeout(() => removeItem(cat, it, li, true), 180);
          return;
        }
      }
      row.style.transform = '';
    };
    row.addEventListener('touchend', end);
    row.addEventListener('touchcancel', end);

    return li;
  }

  function toggleItem(cat, it, li) {
    it.done = !it.done;
    li.classList.toggle('done', it.done);
    const card = li.closest('.cat');
    const wasDone = card.classList.contains('done');
    save();
    updateAll(true);

    const nowDone = cat.items.length > 0 && cat.items.every(i => i.done);
    if (nowDone && !wasDone) {
      // קטגוריה הושלמה – מתכווצת אוטומטית
      setTimeout(() => {
        cat.collapsed = true;
        card.classList.add('collapsed');
        save();
        if (state.filter === 'left') applyFilter();
      }, 550);
    } else if (state.filter === 'left' && it.done) {
      setTimeout(() => { if (it.done) li.classList.add('hidden'); applyFilter(); }, 450);
    }
  }

  function removeItem(cat, it, li, alreadyOut) {
    const h = li.offsetHeight;
    li.style.height = h + 'px';
    li.style.opacity = alreadyOut ? '1' : '0';
    requestAnimationFrame(() => {
      li.style.height = '0px';
      li.style.opacity = '0';
    });
    setTimeout(() => {
      li.remove();
      cat.items = cat.items.filter(i => i.id !== it.id);
      save();
      updateAll(true);
      applyFilter();
    }, 260);
  }

  // ---------- סינון ----------
  const seg = $('seg');
  seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.filter = b.dataset.f;
    save();
    applyFilter();
  });

  function applyFilter() {
    const left = state.filter === 'left';
    seg.dataset.filter = state.filter;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.f === state.filter));

    let visibleCats = 0;
    state.cats.forEach(cat => {
      const card = catsEl.querySelector(`.cat[data-id="${cat.id}"]`);
      if (!card) return;
      card.querySelectorAll('li.item').forEach(li => {
        const it = cat.items.find(i => i.id === li.dataset.id);
        li.classList.toggle('hidden', left && it && it.done);
      });
      const remaining = cat.items.filter(i => !i.done).length;
      const show = !left || remaining > 0;
      card.style.display = show ? '' : 'none';
      if (show) visibleCats++;
    });
    $('empty').style.display = (left && visibleCats === 0) ? 'block' : 'none';
  }

  // ---------- מדים ----------
  let shownPct = 0, pctAnim = null, wasComplete = null;

  function updateAll(animate) {
    let total = 0, done = 0;
    state.cats.forEach(cat => {
      const n = cat.items.length, d = cat.items.filter(i => i.done).length;
      total += n; done += d;
      const card = catsEl.querySelector(`.cat[data-id="${cat.id}"]`);
      if (!card) return;
      card.querySelector('.cat-count').textContent = `${d}/${n}`;
      card.querySelector('.cat-mini i').style.width = (n ? d / n * 100 : 0) + '%';
      card.classList.toggle('done', n > 0 && d === n);
    });

    const pct = total ? Math.round(done / total * 100) : 0;
    $('totalCount').innerHTML = `${done} <span>/ ${total}</span>`;
    $('barFill').style.width = pct + '%';
    $('barFill').classList.toggle('full', pct === 100);
    $('heroMsg').textContent = message(pct, total - done);
    animatePct(pct, animate);

    const complete = total > 0 && done === total;
    if (complete && wasComplete === false && animate) celebrate();
    wasComplete = complete;
  }

  function message(pct, left) {
    if (pct === 100) return 'התיק סגור. אתה מוכן לשביל 🔥';
    if (pct === 0) return 'יאללה, מתחילים לארוז 💪';
    if (pct < 30) return `התחלה טובה · עוד ${left} פריטים`;
    if (pct < 60) return `באמצע הדרך · עוד ${left} פריטים`;
    if (pct < 90) return `כמעט שם! עוד ${left} פריטים`;
    return `עוד ממש קצת… ${left} נשארו`;
  }

  function animatePct(target, animate) {
    const el = $('pct');
    cancelAnimationFrame(pctAnim);
    if (!animate) { shownPct = target; el.textContent = target; return; }
    const from = shownPct, start = performance.now(), dur = 700;
    const step = now => {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      shownPct = Math.round(from + (target - from) * eased);
      el.textContent = shownPct;
      if (p < 1) pctAnim = requestAnimationFrame(step);
    };
    pctAnim = requestAnimationFrame(step);
  }

  // ---------- איפוס ----------
  const resetModal = $('resetModal');
  $('resetBtn').addEventListener('click', () => resetModal.classList.add('show'));
  $('resetCancel').addEventListener('click', () => resetModal.classList.remove('show'));
  resetModal.addEventListener('click', e => { if (e.target === resetModal) resetModal.classList.remove('show'); });
  $('resetChecks').addEventListener('click', () => {
    state.cats.forEach(c => { c.collapsed = false; c.items.forEach(i => i.done = false); });
    save(); render(); resetModal.classList.remove('show');
  });
  $('resetAll').addEventListener('click', () => {
    const f = state.filter;
    state = freshState(); state.filter = f;
    save(); render(); resetModal.classList.remove('show');
  });

  // ---------- 100% – קונפטי ----------
  const readyModal = $('readyModal');
  $('readyClose').addEventListener('click', () => readyModal.classList.remove('show'));

  function celebrate() {
    setTimeout(() => readyModal.classList.add('show'), 350);
    confetti();
  }

  function confetti() {
    const cv = $('confetti'), ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#e5322d', '#f2b84b', '#c08a5c', '#ffffff', '#8a5a36', '#ff6b5e'];
    const parts = [];
    for (let i = 0; i < 180; i++) {
      const fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : innerWidth + 10,
        y: innerHeight * (0.55 + Math.random() * 0.3),
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 7),
        vy: -(9 + Math.random() * 9),
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
        c: colors[(Math.random() * colors.length) | 0],
      });
    }
    const start = performance.now();
    const frame = now => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const t = now - start;
      parts.forEach(p => {
        p.vy += 0.28; p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - t / 4200);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
        ctx.restore();
      });
      if (t < 4200) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(frame);
  }

  // ---------- אייקון למסך הבית (נוצר בקוד) ----------
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#1d1715'); g.addColorStop(1, '#0d0b0a');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#e5322d'; x.fillRect(0, 140, 180, 40);
    x.fillStyle = '#8a5a36'; x.fillRect(0, 132, 180, 8);
    x.font = '96px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('🥾', 90, 74);
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (e) {}

  render();
})();
</script>
</body>
</html>
